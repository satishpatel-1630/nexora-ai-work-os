[build-system]
requires=["setuptools>=69"]
build-backend="setuptools.build_meta"

[project]
name="nexora"
version="0.1.0"
description="NEXORA — Personal AI Work OS"
requires-python=">=3.12"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.10,<3","pydantic-settings>=2.6,<3","httpx>=0.28,<1","sqlalchemy>=2.0,<3","asyncpg>=0.30,<1","alembic>=1.14,<2","redis>=5,<6"]
[project.optional-dependencies]
dev=["pytest>=8,<9","pytest-asyncio>=0.25,<1","ruff>=0.9,<1","mypy>=1.13,<2"]
[tool.setuptools.packages.find]
include=["apps*","core*","intelligence*","capabilities*","tools*","memory*","knowledge*"]
[tool.pytest.ini_options]
asyncio_mode="auto"
[tool.ruff]
line-length=110
target-version="py312"
