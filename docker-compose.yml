services:
  postgres:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: nexora, POSTGRES_PASSWORD: nexora, POSTGRES_DB: nexora}
    volumes: [postgres_data:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U nexora -d nexora"],interval: 5s,timeout: 5s,retries: 10}
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck: {test: ["CMD","redis-cli","ping"],interval: 5s,timeout: 5s,retries: 10}
  api:
    build: {context: .,dockerfile: docker/api.Dockerfile}
    environment: {DATABASE_URL: postgresql+asyncpg://nexora:nexora@postgres:5432/nexora,REDIS_URL: redis://redis:6379/0,CORS_ALLOWED_ORIGINS: http://localhost:3000}
    depends_on: {postgres: {condition: service_healthy},redis: {condition: service_healthy}}
    ports: ["8000:8000"]
  worker:
    build: {context: .,dockerfile: docker/worker.Dockerfile}
    environment: {DATABASE_URL: postgresql+asyncpg://nexora:nexora@postgres:5432/nexora,REDIS_URL: redis://redis:6379/0}
    depends_on: {redis: {condition: service_healthy}}
  web:
    build: {context: .,dockerfile: docker/web.Dockerfile}
    environment: {NEXT_PUBLIC_NEXORA_API_URL: http://localhost:8000}
    depends_on: [api]
    ports: ["3000:3000"]
volumes: {postgres_data:}
